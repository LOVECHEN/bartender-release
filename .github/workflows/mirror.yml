name: mirror

on:
  schedule:
    - cron: '23 */6 * * *'   # 每 6 小时检查官方 Sparkle appcast
  workflow_dispatch:
    inputs:
      max_per_run:
        description: '每通道本次最多新建多少 Release（其余留给后续定时补齐）'
        default: '8'

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      # 官方源 appcast 全部走 Secret（GitHub 自动全串打码；未配置则对应通道自动跳过）
      FEED_B7_STABLE: ${{ secrets.FEED_B7_STABLE }}
      FEED_B7_BETA:   ${{ secrets.FEED_B7_BETA }}
      FEED_B6:        ${{ secrets.FEED_B6 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror · Bartender (from secret appcasts)
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '8' }}
        run: |
          set -euo pipefail
          # ★所有临时文件(feed.xml/items.tsv/zip/SHA)一律写到 RUNNER_TEMP, 绝不落仓库工作目录 → 不会被误提交泄漏 URL
          cd "$RUNNER_TEMP"

          # 解析 Sparkle appcast（version/shortVersionString 为 <item> 子元素）
          parse_feed () {
            python3 - "$1" <<'PY'
          import re, sys
          xml = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          for item in re.findall(r'<item>(.*?)</item>', xml, re.S):
              g = lambda p: (re.search(p, item, re.S) or [None, ''])[1].strip()
              ver   = g(r'<sparkle:shortVersionString>([^<]+)')
              build = g(r'<sparkle:version>([^<]+)')
              url   = (re.search(r'<enclosure\b[^>]*\burl="([^"]+)"', item) or [None, ''])[1]
              if ver and build and url:
                  print(f"{ver}\t{build}\t{url}")
          PY
          }

          mirror_channel () {
            local label="$1" prefix="$2" feed="$3" mark_latest="$4"
            [ -n "$feed" ] || { echo "$label: 未配置 secret, 跳过"; return 0; }
            echo "::group::channel=$label"
            # feed 为 secret（已全串打码）; curl 静默, 失败也不外泄 URL
            if ! curl -fsSL --retry 3 "$feed" -o feed.xml 2>/dev/null; then
              echo "$label: feed 拉取失败"; echo "::endgroup::"; return 0
            fi
            parse_feed feed.xml > items.tsv 2>/dev/null || true
            if [ ! -s items.tsv ]; then echo "$label: 无可解析条目"; echo "::endgroup::"; return 0; fi

            # ★逐条对【完整下载 URL】做 add-mask（含去 query 的基址）→ 任何日志/报错都不外泄整串 URL
            while IFS=$'\t' read -r ver build url; do
              [ -n "$url" ] || continue
              echo "::add-mask::$url"
              local b="${url%%\?*}"; [ "$b" != "$url" ] && echo "::add-mask::$b"
            done < items.tsv

            local newest_tag="${prefix}-$(sort -t"$(printf '\t')" -k2,2 -nr items.tsv | head -n1 | awk -F'\t' '{print $1"."$2}')"
            local made=0
            while IFS=$'\t' read -r ver build url; do
              local tag="${prefix}-${ver}.${build}"
              if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "skip $tag"; continue; fi
              if [ "$made" -ge "$MAX_PER_RUN" ]; then echo "$label 达 max_per_run"; break; fi
              echo "::group::$tag"
              local zip="Bartender-${ver}.${build}.zip"
              if ! curl -fL --retry 3 "$url" -o "$zip" 2>/dev/null; then echo "$tag: 下载失败, skip"; rm -f "$zip"; echo "::endgroup::"; continue; fi
              sha256sum "$zip" > SHA256SUMS.txt
              local notes
              notes="$(printf '## Bartender for macOS\n\n| | |\n|---|---|\n| **App** | Bartender（`com.surteesstudios.Bartender`） |\n| **版本** | %s（build %s） |\n| **通道** | %s |\n| **平台** | macOS（universal） |\n| **文件** | `%s` |\n\n> 官方原版，未经任何修改，逐字节镜像。仅作版本归档 / 离线留存。\n\n**SHA-256**\n```\n%s\n```\n' \
                "$ver" "$build" "$label" "$zip" "$(cat SHA256SUMS.txt)")"
              local latest="--latest=false"
              if [ "$mark_latest" = "yes" ] && [ "$tag" = "$newest_tag" ]; then latest="--latest=true"; fi
              gh release create "$tag" -R "$GITHUB_REPOSITORY" \
                --title "$label · Bartender $ver ($build)" --notes "$notes" $latest \
                "$zip" SHA256SUMS.txt
              rm -f "$zip" SHA256SUMS.txt
              made=$((made+1))
              echo "::endgroup::"
            done < items.tsv
            echo "$label: 新建 $made"
            echo "::endgroup::"
          }

          mirror_channel "B7 stable" "b7"     "$FEED_B7_STABLE" yes
          mirror_channel "B7 beta"   "b7beta" "$FEED_B7_BETA"   no
          mirror_channel "B6 stable" "b6"     "$FEED_B6"        no

      - name: Refresh MIRRORED.md manifest (keep-alive)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "# 已归档版本"
            echo
            echo "> 由 mirror workflow 自动刷新 · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| 通道 | 标题 | tag | 发布(UTC) |"
            echo "|---|---|---|---|"
            gh release list -R "$GITHUB_REPOSITORY" --limit 300 --json tagName,name,createdAt \
              --jq 'sort_by(.tagName)|reverse|.[]|"| \(.tagName|split("-")[0]) | \(.name) | \(.tagName) | \(.createdAt[0:16]|sub("T";" ")) |"'
          } > MIRRORED.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ★只提交 MIRRORED.md(绝不 git add -A, 否则会把 feed.xml/items.tsv 等临时文件误提交泄漏 URL)
          git add MIRRORED.md
          # 历史压平: amend 进【单条】提交 + force-push(刷新清单 + 保活 cron, master 恒 1 个 commit)
          git commit --amend --no-edit
          git push --force origin HEAD:master
